<style>
/* Layout: an iOS app shell. Frosted nav + tab bars over one scroller; a month of daily photos is the hero; days open as card sheets. */
:root {
  --paper: #EEF2EA;      /* cool sage-tinted ground */
  --surface: #FAFBF8;    /* grouped rows, fields */
  --mist: #DDE6D7;       /* soft sage fill for the one highlighted block */
  --sage: #7E9B7E;       /* calm accent */
  --deep: #3D5C48;       /* tint: buttons, links, today ring */
  --on-deep: #F4F7F1;
  --ink: #1E2A23;
  --muted: #66766C;
  --hair: rgba(30, 42, 35, .13);
  --honey: #B27E33;      /* the product being reintroduced */
  --honey-soft: #F2E5CB;
  --danger: #C2412F;
  --bar: rgba(238, 242, 234, .8);
  --glass: rgba(250, 251, 248, .94);
  --behind: #000;
  --scrim: rgba(0, 0, 0, .32);
  --p1: #7E9B7E; --p2: #5A8A8C; --p3: #A493B6; --p4: #C2A877; --p5: #C48E8A; --p6: #6F7F5A;
  --display: 'Fraunces', 'New York', 'Iowan Old Style', Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --tabbar: 50px;
  --ease: cubic-bezier(.32, .72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131915; --surface: #1D2620; --mist: #243129; --sage: #8FAE8C; --deep: #A8C6A2; --on-deep: #14201A;
    --ink: #E6ECE3; --muted: #9AA99F; --hair: rgba(230, 236, 227, .13); --honey: #D9A85E; --honey-soft: #3A3020; --danger: #FF6B5A;
    --bar: rgba(19, 25, 21, .8); --glass: rgba(36, 46, 40, .94); --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131915; --surface: #1D2620; --mist: #243129; --sage: #8FAE8C; --deep: #A8C6A2; --on-deep: #14201A;
  --ink: #E6ECE3; --muted: #9AA99F; --hair: rgba(230, 236, 227, .13); --honey: #D9A85E; --honey-soft: #3A3020; --danger: #FF6B5A;
  --bar: rgba(19, 25, 21, .8); --glass: rgba(36, 46, 40, .94); --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--behind); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.4; letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  position: fixed; inset: 0; overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; }
label { cursor: pointer; }
img { max-width: 100%; display: block; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }
svg { flex-shrink: 0; }
.press { transition: transform .12s, opacity .12s; }
.press:active { transform: scale(.97); opacity: .85; }

/* ---------- shell ---------- */
.stage {
  position: fixed; inset: 0; background: var(--paper); overflow: hidden;
  transform-origin: 50% 0; transition: transform .45s var(--ease), border-radius .45s var(--ease);
}
body.has-sheet .stage { transform: translateY(calc(var(--safe-top) + 6px)) scale(.93); border-radius: 14px; }
.scroller {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--tabbar) + var(--safe-bottom) + 28px);
}
.navbar { position: sticky; top: 0; z-index: 10; padding-top: var(--safe-top); transition: background-color .2s; border-bottom: .5px solid transparent; }
.navbar.compact { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom-color: var(--hair); }
.navbar-inner { max-width: 600px; margin: 0 auto; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 calc(var(--gutter-r) - 6px) 0 var(--gutter-l); }
.nav-title { font-size: 17px; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; white-space: nowrap; }
.navbar.compact .nav-title { opacity: 1; transform: none; }
.nav-right { justify-self: end; display: flex; align-items: center; }
.wordmark { font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 17px; color: var(--muted); transition: opacity .2s; }
.navbar.compact .wordmark { opacity: 0; }
.app { max-width: 600px; margin: 0 auto; padding: 0 var(--gutter-r) 0 var(--gutter-l); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--deep); }
.icon-btn:active { opacity: .45; }
.icon-btn svg { width: 24px; height: 24px; }

.large-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 2px 0 18px; }
.large-title h1 { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 450; font-size: 40px; line-height: 1.02; letter-spacing: -.02em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 50px; padding: 0 20px; border-radius: 14px; font-weight: 600; font-size: 17px; white-space: nowrap; transition: transform .12s, opacity .12s; }
.btn:active { transform: scale(.97); opacity: .8; }
.btn svg { width: 21px; height: 21px; }
.btn-primary { background: var(--deep); color: var(--on-deep); }
.btn-tinted { background: var(--surface); color: var(--deep); }
.btn-small { min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
.btn-block { width: 100%; }
.link { color: var(--deep); font-weight: 400; min-height: 44px; display: inline-flex; align-items: center; padding: 0 6px; }
.link.bold { font-weight: 600; }
.link:active { opacity: .45; }

/* grouped list (iOS settings style) */
.group { background: var(--surface); border-radius: 14px; overflow: hidden; }
.row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 11px 16px; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: .5px; background: var(--hair); }
button.row:active, label.row:active { background: var(--mist); }
.row .txt { flex: 1; min-width: 0; }
.row .name { display: block; overflow-wrap: anywhere; }
.row .meta { display: block; color: var(--muted); font-size: 15px; }
.row .meta.plan { color: var(--honey); }
.row .chev { width: 14px; height: 14px; color: var(--muted); opacity: .6; }
.group-label { font-size: 13px; color: var(--muted); padding: 0 16px 7px; }
.group-foot { font-size: 13px; color: var(--muted); padding: 7px 16px 0; line-height: 1.4; }
.row.center { justify-content: center; }
.row.destructive { color: var(--danger); justify-content: center; }

/* ---------- calendar ---------- */
.month-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; margin: 0 0 16px; }
.month-title { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.month-title h1 { font-family: var(--display); font-variation-settings: "SOFT" 100, "WONK" 0; font-weight: 400; font-size: clamp(40px, 12vw, 54px); line-height: .95; letter-spacing: -.025em; white-space: nowrap; }
.month-title .year { font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 18px; color: var(--muted); font-variant-numeric: lining-nums; padding-left: 2px; }
.month-nav { display: flex; align-items: center; flex-shrink: 0; margin-right: -8px; }
.nav-left { display: flex; align-items: center; min-width: 0; }
.today-pill { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 13px 0 7px; border-radius: 999px; background: var(--surface); color: var(--deep); font-size: 15px; font-weight: 600; box-shadow: 0 0 0 .5px var(--hair); transition: opacity .12s, transform .12s; }
.today-pill svg { width: 17px; height: 17px; }
.today-pill:active { opacity: .6; transform: scale(.96); }

.weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.weekdays { margin-bottom: 6px; }
.weekdays span { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.grid { touch-action: pan-y; transition: opacity .18s, transform .18s; }
.grid.slide-l { opacity: 0; transform: translateX(-18px); }
.grid.slide-r { opacity: 0; transform: translateX(18px); }
.cell {
  position: relative; aspect-ratio: 1 / 1.22; border-radius: 13px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 6px 2px 7px; background: var(--surface); border: 1px solid transparent;
  font-variant-numeric: tabular-nums; transition: transform .12s;
}
.cell.blank { background: transparent; pointer-events: none; }
.cell .num { position: relative; z-index: 1; font-size: 15px; font-weight: 500; line-height: 1.2; }
.cell.future { background: transparent; border: 1px dashed var(--hair); }
.cell.future .num { color: var(--muted); }
.cell.today { border: 2px solid var(--deep); }
.cell.today .num { font-weight: 700; color: var(--deep); }
.cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cell.has-photo .num { background: var(--glass); color: var(--ink); border-radius: 999px; padding: 0 6px; font-size: 12.5px; font-weight: 600; }
.cell.has-photo.today .num { background: var(--deep); color: var(--on-deep); }
.cell:active { transform: scale(.93); }
.dots { position: relative; z-index: 1; display: flex; gap: 3px; align-items: center; justify-content: center; min-height: 8px; }
.cell.has-photo .dots:not(:empty) { background: var(--glass); border-radius: 999px; padding: 2px 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--sage)); display: block; }
.dots i.used { background: var(--honey); width: 7px; height: 7px; }
.dots i.due { background: transparent; border: 1.5px solid var(--honey); width: 8px; height: 8px; }
.dots i.note { width: 7px; height: 2px; border-radius: 2px; background: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 14px 2px 22px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.legend .used { background: var(--honey); }
.legend .due { border: 1.5px solid var(--honey); width: 9px; height: 9px; }
.legend .prod { background: var(--sage); }
.legend .note { width: 8px; height: 2px; border-radius: 2px; background: var(--muted); }

/* today panel: the one highlighted object on the page */
.today-panel { background: var(--mist); border-radius: 24px; padding: 20px; display: grid; gap: 16px; }
.today-panel h2 { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 450; font-size: 27px; line-height: 1.12; }
.today-panel .sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
.today-row { display: flex; align-items: center; gap: 14px; }
.today-thumb { width: 66px; height: 84px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
.today-thumb.empty { display: grid; place-items: center; background: var(--surface); border: 1.5px dashed var(--sage); color: var(--deep); }
.today-thumb.empty svg { width: 26px; height: 26px; }
.today-row .txt { min-width: 0; flex: 1; }
.today-row .txt strong { display: block; font-weight: 600; }
.today-row .txt span { display: block; color: var(--muted); font-size: 15px; }
.plan-line { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; padding: 12px 12px 12px 14px; }
.plan-line .mark { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--honey); }
.plan-line .mark.rest { background: transparent; border: 2px solid var(--honey); }
.plan-line .txt { flex: 1; min-width: 0; font-size: 15px; line-height: 1.3; }
.plan-line .txt strong { font-weight: 600; display: block; }
.plan-line .txt span { color: var(--muted); display: block; font-size: 13.5px; margin-top: 2px; }
.today-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.today-foot { font-size: 14px; color: var(--muted); }
.today-foot button { color: var(--deep); font-weight: 600; }

.install { background: var(--surface); border-radius: 18px; padding: 14px 16px; margin-bottom: 18px; display: flex; gap: 12px; align-items: flex-start; }
.install img { width: 46px; height: 46px; border-radius: 11px; }
.install .txt { flex: 1; font-size: 15px; line-height: 1.35; }
.install .txt strong { display: block; }
.install .txt span { color: var(--muted); }
.install .share { display: inline-block; width: 16px; height: 16px; vertical-align: -2px; color: var(--deep); }
.install .x { color: var(--muted); width: 30px; height: 30px; display: grid; place-items: center; margin: -4px -6px 0 0; }
.install .x svg { width: 16px; height: 16px; }

/* ---------- photos ---------- */
.photo-month { margin-bottom: 24px; }
.photo-month h2 { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 450; font-size: 21px; margin: 0 0 9px 2px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; border-radius: 14px; overflow: hidden; }
.ph { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--surface); }
.ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .12s; }
.ph:active img { transform: scale(.96); }
.ph .lab { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.45)); color: #fff; font-size: 12.5px; font-weight: 600; text-align: left; }
.ph .pick { position: absolute; top: 7px; right: 7px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.18); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
.ph.picked img { opacity: .78; }
.ph.picked .pick { background: var(--deep); border-color: #fff; color: var(--on-deep); }
.compare-hint { color: var(--muted); font-size: 15px; margin: -8px 0 14px 2px; }

/* ---------- products ---------- */
.add-form { display: flex; gap: 8px; margin-bottom: 22px; }
.field { width: 100%; min-height: 46px; border-radius: 12px; border: 0; background: var(--surface); padding: 0 14px; font-size: 17px; }
.field::placeholder { color: var(--muted); opacity: .8; }
.field:focus { outline: 2px solid var(--deep); outline-offset: 0; }
.add-form .btn { min-height: 46px; border-radius: 12px; padding: 0 18px; }
.swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.suggest { margin-top: 22px; }
.suggest p { color: var(--muted); font-size: 15px; margin: 0 0 10px 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--deep); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip svg { width: 15px; height: 15px; }
.chip:active { background: var(--mist); }
.hint { color: var(--muted); font-size: 14px; margin: 8px 16px 0; line-height: 1.4; }

/* ---------- empty states ---------- */
.empty { text-align: center; padding: 36px 12px; display: grid; gap: 12px; justify-items: center; }
.empty .art { width: 84px; height: 84px; border-radius: 26px; background: var(--mist); color: var(--deep); display: grid; place-items: center; }
.empty .art svg { width: 38px; height: 38px; }
.empty h2 { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 450; font-size: 24px; }
.empty p { color: var(--muted); max-width: 30ch; font-size: 16px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--hair);
  padding: 0 var(--gutter-r) var(--safe-bottom) var(--gutter-l);
}
.tabbar nav { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .01em; padding-top: 2px; }
.tab svg { width: 26px; height: 26px; }
.tab svg .fill { fill: transparent; }
.tab[aria-selected="true"] { color: var(--deep); }
.tab[aria-selected="true"] svg .fill { fill: currentColor; fill-opacity: .18; }

/* ---------- card sheets ---------- */
.backdrop { position: fixed; inset: 0; z-index: 39; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .4s var(--ease); }
body.has-sheet .backdrop { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--safe-top) + 12px); margin: 0 auto; max-width: 640px;
  z-index: 40; background: var(--paper); border-radius: 14px 14px 0 0;
  display: flex; flex-direction: column; transform: translateY(105%);
  transition: transform .45s var(--ease); box-shadow: 0 -1px 24px rgba(0, 0, 0, .14);
}
.sheet.open { transform: none; }
.sheet.stacked { z-index: 45; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--hair); margin: 6px auto 0; flex-shrink: 0; }
.sheet-bar { flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 46px; padding: 0 calc(var(--gutter-r) - 6px) 0 calc(var(--gutter-l) - 8px); }
.sheet-bar .left { display: flex; align-items: center; }
.sheet-bar .right { justify-self: end; }
.sheet-bar .title { font-size: 17px; font-weight: 600; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-bar .link { font-size: 17px; }
.sheet-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 6px var(--gutter-r) calc(var(--safe-bottom) + 40px) var(--gutter-l);
}
.sheet-inner { max-width: 600px; margin: 0 auto; display: grid; gap: 26px; }
.day-head { touch-action: pan-y; }
.day-title { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 450; font-size: 34px; line-height: 1.06; letter-spacing: -.015em; text-wrap: balance; }
.day-sub { color: var(--muted); margin-top: 4px; font-size: 15px; }
.block-head { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; min-height: 30px; }
.block-head h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.block-head .link { font-size: 16px; min-height: 30px; padding-right: 2px; }
.block-head small { color: var(--muted); font-size: 14px; }

.photo-strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; margin-right: calc(-1 * var(--gutter-r)); padding-right: var(--gutter-r); scrollbar-width: none; }
.photo-strip::-webkit-scrollbar { display: none; }
.photo-strip > * { scroll-snap-align: start; flex-shrink: 0; }
.strip-photo { width: 62%; max-width: 270px; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: var(--surface); }
.strip-photo img { width: 100%; height: 100%; object-fit: cover; }
.strip-add { width: 30%; max-width: 130px; aspect-ratio: 3 / 4; border-radius: 18px; background: var(--surface); color: var(--deep); display: grid; place-content: center; justify-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-align: center; }
.strip-add svg { width: 28px; height: 28px; }
.strip-add:active { background: var(--mist); }
.photo-empty { background: var(--surface); border-radius: 22px; padding: 26px 18px 18px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.photo-empty .art { width: 64px; height: 64px; border-radius: 20px; background: var(--mist); color: var(--deep); display: grid; place-items: center; }
.photo-empty .art svg { width: 30px; height: 30px; }
.photo-empty p { color: var(--muted); font-size: 15px; max-width: 30ch; }
.photo-empty .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.photo-empty .two .btn-tinted { background: var(--mist); }

.use { position: relative; }
.use + .use::before { content: ""; position: absolute; top: 0; right: 0; left: 56px; height: .5px; background: var(--hair); }
.use-toggle { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 56px; text-align: left; }
.use-toggle:active { background: var(--mist); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--hair); flex-shrink: 0; display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s, transform .15s; }
.check svg { width: 15px; height: 15px; }
.use.on .check { background: var(--c, var(--sage)); border-color: var(--c, var(--sage)); color: #fff; transform: scale(1.04); }
.use.tracked.on .check { background: var(--honey); border-color: var(--honey); }
.use-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.badge { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.badge.due { background: var(--honey-soft); color: var(--honey); }
.badge.rest { background: var(--mist); color: var(--muted); }
.badge.free { background: var(--mist); color: var(--deep); }
.contact { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 16px 14px 56px; }
.contact > span { font-size: 14px; color: var(--muted); flex-basis: 100%; }
.stepper { display: inline-flex; align-items: center; background: var(--paper); border-radius: 10px; }
.stepper button { width: 46px; height: 38px; display: grid; place-items: center; font-size: 22px; font-weight: 400; color: var(--deep); border-radius: 10px; }
.stepper button:active { background: var(--mist); }
.stepper output { min-width: 84px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 16px; border-left: .5px solid var(--hair); border-right: .5px solid var(--hair); }
.contact .btn { min-height: 38px; padding: 0 14px; font-size: 15px; border-radius: 10px; background: var(--honey-soft); color: var(--honey); }
.contact .btn svg { width: 18px; height: 18px; }
.goal-note { font-size: 13px; color: var(--muted); }

.notes { width: 100%; min-height: 140px; resize: none; border-radius: 14px; border: 0; background: var(--surface); padding: 14px 16px; font-size: 17px; line-height: 1.45; display: block; }
.notes::placeholder { color: var(--muted); opacity: .8; }
.notes:focus { outline: 2px solid var(--deep); outline-offset: 0; }
.saved { font-size: 14px; color: var(--muted); transition: opacity .3s; }

/* product sheet */
.swatches { display: flex; gap: 14px; flex-wrap: wrap; padding: 14px 16px; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--hair); }
.swatches button[aria-checked="true"] { box-shadow: 0 0 0 2px var(--ink); }
.switch { width: 51px; height: 31px; border-radius: 999px; background: var(--hair); position: relative; flex-shrink: 0; transition: background .25s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.12); transition: transform .25s var(--ease); }
.switch[aria-checked="true"] { background: var(--honey); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.plan-cell { padding: 14px 16px; display: grid; gap: 10px; }
.plan-cell + .plan-cell { border-top: .5px solid var(--hair); }
.plan-cell .lbl { font-size: 15px; color: var(--muted); }
.plan-cell.inline { grid-template-columns: 1fr auto; align-items: center; }
.plan-cell.inline .lbl { color: var(--ink); font-size: 17px; }
.plan-cell .stepper { background: var(--mist); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--mist); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { min-height: 34px; border-radius: 7px; font-size: 15px; font-weight: 500; color: var(--ink); transition: background .2s; }
.seg button[aria-checked="true"] { background: var(--surface); font-weight: 600; color: var(--honey); box-shadow: 0 3px 8px rgba(0,0,0,.1), 0 1px 1px rgba(0,0,0,.06); }
.status-lines { display: grid; gap: 3px; font-size: 15px; }
.status-lines strong { font-weight: 600; font-size: 16px; }
.status-lines span { color: var(--muted); }
.chart-box { padding: 14px 10px 8px 6px; }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 11px; }
.history .row { font-size: 15px; justify-content: space-between; }
.history .row span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted-row { color: var(--muted); font-size: 15px; }

/* settings */
.stat-row { justify-content: space-between; }
.stat-row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.row.action { color: var(--deep); }
.set-intro { font-size: 15px; color: var(--muted); line-height: 1.45; padding: 0 4px; }

/* photo viewer */
.viewer { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; display: flex; flex-direction: column; }
.viewer .vbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: calc(var(--safe-top) + 4px) calc(var(--gutter-r) - 6px) 4px calc(var(--gutter-l) - 6px); min-height: 50px; }
.viewer .vbar .link, .viewer .vfoot .link { color: #fff; }
.viewer .vbar .right { justify-self: end; }
.viewer-title { font-size: 16px; font-weight: 600; text-align: center; }
.viewer-title small { display: block; font-weight: 400; font-size: 12.5px; opacity: .7; }
.viewer-img { flex: 1; min-height: 0; display: grid; place-items: center; touch-action: none; }
.viewer-img img { max-height: 100%; max-width: 100%; object-fit: contain; transition: transform .25s var(--ease); }
.vfoot { display: flex; justify-content: space-between; align-items: center; padding: 8px calc(var(--gutter-r) - 6px) calc(var(--safe-bottom) + 10px) calc(var(--gutter-l) - 6px); max-width: 640px; width: 100%; margin: 0 auto; }
.vfoot .icon-btn { color: #fff; }

/* compare */
.cmp { position: relative; width: 100%; max-width: 460px; margin: 0 auto; aspect-ratio: 3 / 4; border-radius: 20px; overflow: hidden; background: #000; touch-action: none; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cmp .top { clip-path: inset(0 calc(100% - var(--x, 50%)) 0 0); }
.cmp .divider { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
.cmp .knob { position: absolute; top: 50%; left: var(--x, 50%); width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); display: grid; place-items: center; color: #333; pointer-events: none; }
.cmp .knob svg { width: 20px; height: 20px; }
.cmp .tag { position: absolute; top: 12px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; padding: 4px 10px; border-radius: 999px; }
.cmp .tag.l { left: 12px; } .cmp .tag.r { right: 12px; }
.cmp-note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 12px; }

/* timer */
.timer { position: fixed; inset: 0; z-index: 70; background: var(--paper); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .45s var(--ease); }
.timer.open { transform: none; }
.timer .tbar { padding: calc(var(--safe-top) + 4px) var(--gutter-r) 0 calc(var(--gutter-l) - 6px); min-height: 50px; display: flex; align-items: center; }
.timer-body { flex: 1; display: grid; place-items: center; align-content: center; gap: 24px; padding: 0 var(--gutter-r) calc(var(--safe-bottom) + 28px) var(--gutter-l); text-align: center; }
.ring { position: relative; width: min(76vw, 310px); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--mist); }
.ring .prog { stroke: var(--honey); transition: stroke-dashoffset .2s linear; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; }
.ring .big { font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 72px; font-weight: 350; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.ring .small { color: var(--muted); font-size: 15px; }
.timer-name { font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 26px; }
.timer-msg { min-height: 24px; color: var(--muted); font-size: 16px; }
.timer-msg.done { color: var(--honey); font-weight: 600; }
.timer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 360px; }
.round { width: 86px; height: 86px; border-radius: 50%; justify-self: center; font-size: 17px; font-weight: 500; display: grid; place-items: center; transition: transform .12s, opacity .12s; }
.round:active { transform: scale(.94); }
.round.quiet { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--surface); }
.round.go { background: var(--deep); color: var(--on-deep); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--deep); }
.round.go.pause { background: var(--honey-soft); color: var(--honey); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--honey-soft); }
#timerLog { max-width: 360px; }

/* action sheet + toast */
.as-wrap { position: fixed; inset: 0; z-index: 90; background: var(--scrim); opacity: 0; transition: opacity .3s; display: flex; align-items: flex-end; justify-content: center; }
.as-wrap.show { opacity: 1; }
.as { width: 100%; max-width: 440px; padding: 0 8px calc(var(--safe-bottom) + 8px); display: grid; gap: 8px; transform: translateY(110%); transition: transform .4s var(--ease); }
.as-wrap.show .as { transform: none; }
.as-group { background: var(--glass); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border-radius: 14px; overflow: hidden; }
.as-head { padding: 14px 18px; text-align: center; display: grid; gap: 3px; border-bottom: .5px solid var(--hair); }
.as-head strong { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.as-head span { font-size: 13px; color: var(--muted); }
.as-btn { width: 100%; min-height: 57px; font-size: 20px; color: var(--deep); background: var(--glass); }
.as-group .as-btn { background: transparent; }
.as-btn.danger { color: var(--danger); }
.as-btn.cancel { border-radius: 14px; font-weight: 600; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
.as-btn:active { background: var(--mist); }
.toast {
  position: fixed; left: 50%; top: calc(var(--safe-top) + 10px); z-index: 95;
  transform: translate(-50%, -16px) scale(.96); opacity: 0; pointer-events: none;
  background: var(--glass); color: var(--ink); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .16); transition: opacity .25s, transform .35s var(--ease);
  width: max-content; max-width: calc(100vw - 32px); text-align: center; display: flex; align-items: center; gap: 8px;
}
.toast svg { width: 18px; height: 18px; color: var(--deep); }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.banner { background: var(--honey-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
.busy { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; background: rgba(0,0,0,.18); }
.busy div { background: var(--glass); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 18px; padding: 20px 26px; display: grid; gap: 12px; justify-items: center; font-weight: 600; font-size: 15px; color: var(--ink); }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--hair); border-top-color: var(--deep); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.haptic { position: fixed; left: -200px; top: 0; opacity: 0; pointer-events: none; }

/* photo slots: front, left side, right side */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: var(--surface); display: grid; place-content: center; justify-items: center; gap: 4px; color: var(--deep); font-size: 14px; font-weight: 600; text-align: center; transition: transform .12s; }
.slot:active { transform: scale(.96); }
.slot.empty { border: 1.5px dashed var(--sage); background: transparent; }
.slot.empty svg { width: 36px; height: 36px; color: var(--sage); }
.slot.empty small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .tag { position: absolute; left: 6px; bottom: 6px; background: var(--glass); color: var(--ink); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.slot-tip { color: var(--muted); font-size: 14px; margin: 10px 2px 0; }
.today-slots { gap: 7px; }
.today-slots .slot { border-radius: 12px; }
.today-slots .slot.empty { background: var(--surface); }
.today-slots .slot.empty svg { width: 28px; height: 28px; }
.today-slots .slot .tag { font-size: 11px; left: 5px; bottom: 5px; padding: 1px 7px; }

/* streak */
.streak { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: .5px solid var(--hair); }
.streak .num { font-family: var(--display); font-variation-settings: "SOFT" 100; font-size: 54px; line-height: .85; font-weight: 400; color: var(--honey); font-variant-numeric: lining-nums tabular-nums; min-width: 34px; text-align: center; }
.streak .txt { flex: 1; min-width: 0; }
.streak .txt strong { display: block; font-size: 17px; font-weight: 600; line-height: 1.2; }
.streak .txt span { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.3; margin-top: 2px; }
.week { display: grid; grid-template-columns: repeat(7, 13px); gap: 5px 4px; text-align: center; flex-shrink: 0; }
.week b { font-size: 10px; font-weight: 600; color: var(--muted); line-height: 1; }
.week i { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); display: block; }
.week i.on { background: var(--honey); }
.week i.today:not(.on) { background: transparent; box-shadow: inset 0 0 0 1.5px var(--honey); }
.streak-pill { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--honey-soft); color: var(--honey); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 2px; }
.streak-pill svg { width: 16px; height: 16px; }
.streak-pill:active { opacity: .6; }

/* photos tab */
.seg.filter { margin: -4px 0 20px; }
.seg.filter button[aria-checked="true"] { color: var(--deep); }
.day-row { margin-bottom: 20px; }
.day-row h2 { font-size: 16px; font-weight: 600; margin: 0 0 8px 2px; display: flex; gap: 8px; align-items: baseline; }
.day-row h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
.slots .ph { border-radius: 14px; }
.ph.missing { border: 1.5px dashed var(--hair); background: transparent; display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--muted); font-size: 12.5px; }
.ph.missing svg { width: 26px; height: 26px; opacity: .7; }
.vfoot .mid { display: flex; gap: 4px; }

/* ---------- third-party overlays (hosting badges) never show ---------- */
netlify-badge, [id*="netlify" i], [class*="netlify" i], iframe[src*="netlify" i] { display: none !important; visibility: hidden !important; pointer-events: none !important; }

/* ---------- morning / night routines ---------- */
.routines { display: grid; gap: 18px; }
.slot-head { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; }
.slot-head svg { width: 20px; height: 20px; color: var(--honey); }
.slot-head.pm svg { color: var(--p2); }
.slot-head h4 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
.slot-head small { color: var(--muted); font-size: 14px; }
.use-more { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 48px; padding: 10px 16px; color: var(--deep); font-size: 16px; position: relative; }
.use-more::before { content: ""; position: absolute; top: 0; right: 0; left: 56px; height: .5px; background: var(--hair); }
.use-more:first-child::before { display: none; }
.use-more .plus { width: 26px; height: 26px; display: grid; place-items: center; }
.use-more .plus svg { width: 18px; height: 18px; }
.use.extra .use-name { color: var(--muted); }
.use.extra.on .use-name { color: var(--ink); }
.slot-empty { padding: 14px 16px; color: var(--muted); font-size: 15px; }
.setup-card { display: flex; gap: 12px; align-items: center; background: var(--honey-soft); border-radius: 14px; padding: 12px 14px; }
.setup-card .txt { flex: 1; font-size: 15px; line-height: 1.35; }
.setup-card strong { display: block; font-size: 16px; }
.routine-row { display: grid; gap: 8px; padding: 12px 16px; position: relative; }
.routine-row + .routine-row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: .5px; background: var(--hair); }
.routine-row .name { font-weight: 500; overflow-wrap: anywhere; }
.seg.routine button[aria-checked="true"] { color: var(--deep); }
.seg.two { grid-template-columns: repeat(2, 1fr); }

/* ---------- ask (AI) ---------- */
body.asking .scroller { padding-bottom: calc(var(--tabbar) + var(--safe-bottom) + var(--composer-h, 64px) + 20px); }
.chat { display: grid; gap: 14px; }
.msg { max-width: 100%; }
.msg.user { justify-self: end; max-width: 86%; background: var(--deep); color: var(--on-deep); padding: 9px 14px; border-radius: 20px 20px 6px 20px; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.msg.ai { background: var(--surface); border-radius: 6px 20px 20px 20px; padding: 12px 16px; font-size: 16.5px; line-height: 1.45; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.msg.ai p, .msg.ai ul, .msg.ai ol { margin: 0 0 9px; }
.msg.ai > :last-child { margin-bottom: 0; }
.msg.ai ul, .msg.ai ol { padding-left: 20px; }
.msg.ai li { margin: 3px 0; }
.msg.ai h4 { margin: 12px 0 5px; font-size: 16.5px; font-weight: 700; }
.msg.ai h4:first-child { margin-top: 0; }
.msg.ai strong { font-weight: 650; }
.msg-foot { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 6px 6px 0; color: var(--muted); font-size: 12.5px; }
.msg-foot .looked { display: inline-flex; gap: 5px; align-items: center; }
.msg-foot svg { width: 14px; height: 14px; }
.msg.err { background: transparent; border: 1px solid var(--hair); color: var(--ink); }
.msg.err strong { color: var(--danger); }
.status { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 15px; padding: 4px 6px; }
.dots3 { display: inline-flex; gap: 4px; }
.dots3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); animation: blink 1.2s infinite ease-in-out; }
.dots3 i:nth-child(2) { animation-delay: .2s; } .dots3 i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: none; } }
.ask-intro { display: grid; gap: 14px; padding: 6px 0 4px; }
.ask-intro .lead { color: var(--muted); font-size: 16px; line-height: 1.45; }
.sugg { display: grid; gap: 8px; }
.sugg button { text-align: left; background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: 16px; color: var(--deep); font-weight: 500; }
.sugg button:active { background: var(--mist); }
.privacy-note { color: var(--muted); font-size: 13px; line-height: 1.4; padding: 0 4px; }
.composer { position: absolute; left: 0; right: 0; bottom: calc(var(--tabbar) + var(--safe-bottom)); z-index: 19; padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--hair); }
.composer-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; }
.composer textarea { flex: 1; resize: none; border: .5px solid var(--hair); background: var(--surface); border-radius: 20px; padding: 9px 14px; font-size: 17px; line-height: 1.3; max-height: 140px; min-height: 40px; outline: none; }
.composer textarea:focus { border-color: var(--sage); }
.send { width: 40px; height: 40px; border-radius: 50%; background: var(--deep); color: var(--on-deep); display: grid; place-items: center; flex-shrink: 0; transition: opacity .15s, transform .12s; }
.send:disabled { opacity: .35; }
.send:active { transform: scale(.94); }
.send svg { width: 20px; height: 20px; }
body.kb-open .composer { bottom: var(--kb, 0px); }
body.kb-open .tabbar { visibility: hidden; }
.key-field { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }
.inline-actions { display: flex; gap: 8px; }
.inline-actions .btn { flex: 1; min-height: 44px; font-size: 16px; }
.inline-actions .btn-tinted { background: var(--mist); }
.msg.err .retry { display: block; margin-top: 8px; color: var(--deep); font-weight: 600; font-size: 15px; min-height: 32px; }
.ai-ok { color: var(--deep); }
.ai-bad { color: var(--danger); }
.about-field { width: 100%; min-height: 84px; border: 0; border-radius: 12px; background: var(--surface); padding: 10px 14px; font-size: 16px; resize: vertical; }

<script>
'use strict';
/* Hosting badges (e.g. "Powered by Netlify") are blocked by the page's security policy; this removes any that still get added. */
(() => {

const todayKey = () => keyOf(new Date());

const fmtLong = k => fmt(k, { weekday: 'long', day: 'numeric', month: 'long' });

/* ================= storage ================= */
const KEYPATH = { days: 'date', meta: 'key', photos: 'id', thumbs: 'id', products: 'id', chats: 'id' };
const store = {
  db: null, mem: null,
  async open() {

      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('skin-diary', 2);

/* A day keeps what was used in the morning (am), at night (pm), and entries logged before
   routines existed (any). `used` is always the merged view, so everything that only needs
   "was it used that day" (calendar, plans, streaks, older app versions, backups) keeps working. */
const SLOTS = ['am', 'pm', 'any'];
const SLOT_LABEL = { am: 'Morning', pm: 'Night', any: 'Time not recorded' };
const ROUTINES = [['am', 'Morning'], ['pm', 'Night'], ['both', 'Both'], ['none', 'As needed']];
const routineOf = p => p.routine || 'both';
const routineLabel = r => ({ am: 'Morning', pm: 'Night', both: 'Morning and night', none: 'As needed' })[r] || 'Morning and night';
const inRoutine = (p, slot) => { const r = routineOf(p); return slot === 'am' ? r === 'am' || r === 'both' : slot === 'pm' ? r === 'pm' || r === 'both' : false; };
const guessRoutine = name => /\b(spf|sun|suncreen|sunscreen|sunblock|sun ?serum)\b/i.test(name) ? 'am' : 'both';
const nowSlot = () => new Date().getHours() < 15 ? 'am' : 'pm';

  if (!('any' in d) && !d.am && !d.pm) d.any = { ...(d.used || {}) };
  for (const sl of SLOTS) if (!d[sl] || typeof d[sl] !== 'object') d[sl] = {};
  mergeUsed(d); return d;
}
function mergeUsed(d) {
  const u = {};
  for (const sl of SLOTS) for (const [pid, v] of Object.entries(d[sl] || {})) {
    if (!u[pid]) u[pid] = { ...v };
    else if (v && v.sec != null) u[pid].sec = Math.max(u[pid].sec ?? 0, v.sec);
  }
  d.used = u;
}
function dayOf(k) { return S.days.get(k) || { date: k, notes: '', am: {}, pm: {}, any: {}, used: {} }; }

  else { S.days.set(day.date, day); await store.put('days', day); }
}

function usesOf(pid) { const out = []; for (const [k, d] of S.days) if (d.used && d.used[pid]) out.push(k); return out.sort(); }

function trackStatus(p, k) {
  const uses = usesOf(p.id);
  if (uses.includes(k)) return { state: 'used' };
  const prev = uses.filter(u => u < k).pop();
  if (!prev) return { state: 'free' };
  const due = addDays(prev, p.every);
  return k < due ? { state: 'rest', due, prev } : { state: 'due', due, prev };
}
function scheduled(p, from, to) {
  const tk = todayKey();
  const uses = usesOf(p.id).filter(u => u <= tk);
  const out = new Set();
  if (!uses.length) return out;
  let next = addDays(uses[uses.length - 1], p.every);
  if (next < tk) next = tk;
  let guard = 0;
  while (next <= to && guard++ < 400) {
    if (next >= from && !(dayOf(next).used || {})[p.id]) out.add(next);
    next = addDays(next, p.every);
  }

}

function missingAngles(k) { return ANGLE_KEYS.filter(a => !slotPhoto(k, a)); }
/* streak: consecutive days with at least one photo. Today doesn't break it until the day is over. */
function streakInfo() {
  const tk = todayKey();
  const has = k => photosOn(k).length > 0;
  let k = has(tk) ? tk : addDays(tk, -1), cur = 0;
  while (has(k) && cur < 3660) { cur++; k = addDays(k, -1); }

  for (const d of days) { run = prev && diffDays(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; }

}

async function loadBitmap(file) {

  return await new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); URL.revokeObjectURL(url); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That photo couldn\'t be read. Try a different one.')); }; im.src = url; });
}
function resize(src, max, q) {
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);

/* Fill a day's slots. A chosen angle goes first (replacing what's there); extra files fill the empty slots in order. */
async function addPhotos(k, files, angle) {
  if (!files || !files.length) return;
  const free = missingAngles(k);
  const order = angle ? [angle, ...free.filter(a => a !== angle)] : free;
  if (!order.length) { toast('All 3 photos are in for this day. Open one to retake it.', false); return; }
  const use = files.slice(0, order.length);
  const busy = showBusy(use.length > 1 ? `Saving ${use.length} photos` : 'Saving photo');
  let added = 0, lastAngle = null;
  try {
    for (let i = 0; i < use.length; i++) {
      const a = order[i];
      try {
        const bmp = await loadBitmap(use[i]);
        const full = await resize(bmp, 1600, .85);
        const thumb = await resize(bmp, 420, .78);
        if (bmp.close) bmp.close();
        const old = slotPhoto(k, a); if (old) await removePhoto(old.id, k);
        const id = uid(), createdAt = Date.now();
        await store.put('photos', { id, date: k, angle: a, blob: full, createdAt });
        await store.put('thumbs', { id, date: k, angle: a, blob: thumb, createdAt });
        const list = S.thumbs.get(k) || []; list.push({ id, date: k, angle: a, createdAt, url: URL.createObjectURL(thumb) }); S.thumbs.set(k, list);
        added++; lastAngle = a;
      } catch (e) { toast(e.message || 'That photo couldn\'t be added. Try a different one.', false); }
    }
  } finally { busy.remove(); }
  if (added) {
    const left = missingAngles(k).length;
    haptic(); askPersist();
    toast(added > 1 ? `${added} photos added` : `${angleLabel(lastAngle)} added${left ? `, ${left} to go` : ''}`);
    if (files.length > order.length) setTimeout(() => toast(`Only ${order.length} fitted. Each day has 3 photo slots.`, false), 2300);
  }
  renderAll(); if (S.openDay === k) renderDayPhotos();
}

/* drag a sheet down to dismiss it, like iOS */
function enableSheetDrag(sheet) {
  const body = sheet.querySelector('.sheet-body');
  let sx = 0, sy = 0, dy = 0, t0 = 0, decided = false, dragging = false;
  sheet.addEventListener('touchstart', e => {
    decided = false; dragging = false; dy = 0;
    if (e.touches.length !== 1 || e.target.closest('textarea, input, .cmp')) { decided = true; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = performance.now();
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (decided && !dragging) return;

    if (!decided) {
      if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
      decided = true;
      const atTop = !body || body.scrollTop <= 0 || !!e.target.closest('.sheet-bar, .grabber');
      dragging = ddy > 0 && Math.abs(ddy) > Math.abs(ddx) * 1.2 && atTop;
      if (!dragging) return;

    if (!dragging) return; dragging = false;
    const v = dy / Math.max(1, performance.now() - t0);

function contactChart(p, uses) {
  const pts = uses.map(u => ({ k: u, s: (S.days.get(u).used[p.id] || {}).sec })).filter(x => typeof x.s === 'number').slice(-14);
  if (!pts.length) return `<div><p class="group-label">Contact time</p><div class="group"><p class="row muted-row">Log contact time on the days you use it and your ramp-up shows here.</p></div></div>`;
  const W = 340, H = 160, L = 38, R = 10, T = 12, B = 26;
  const max = Math.max(p.target, ...pts.map(x => x.s), 10);
  const step = [5, 10, 15, 30, 60, 120, 300].find(s => max / s <= 4) || 300;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const slots = Math.max(pts.length, 7); const bw = (W - L - R) / slots; const barW = Math.min(18, bw * .55);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)" stroke-width="1"/><text x="${L - 7}" y="${y(v) + 4}" text-anchor="end">${secShort(v)}</text>`;
  pts.forEach((x, i) => { const cx = L + bw * i + bw / 2; const last = i === pts.length - 1; g += `<rect x="${cx - barW / 2}" y="${y(x.s)}" width="${barW}" height="${Math.max(2, y(0) - y(x.s))}" rx="4" fill="var(--honey)" fill-opacity="${last ? 1 : .55}"/>`; });
  const ty = y(p.target);
  g += `<line x1="${L}" x2="${W - R}" y1="${ty}" y2="${ty}" stroke="var(--deep)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  const fx = L + bw / 2, lx = L + bw * (pts.length - 1) + bw / 2;
  if (pts.length === 1 || lx - fx > 64) g += `<text x="${fx}" y="${H - 6}" text-anchor="middle">${esc(fmtDM(pts[0].k))}</text>`;
  if (pts.length > 1) g += `<text x="${lx}" y="${H - 6}" text-anchor="middle">${esc(fmtDM(pts[pts.length - 1].k))}</text>`;
  return `<div><p class="group-label">Contact time, last ${pts.length} use${pts.length > 1 ? 's' : ''}</p><div class="group chart-box"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Contact time per use. Dashed line is your goal of ${esc(secLabel(p.target))}.">${g}</svg></div><p class="group-foot">Dashed line is your goal.</p></div>`;
}

    try { return await streamOnce(body, onEvent, signal); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      if (!(e instanceof AIError) || !e.retry || attempt >= waits.length || hasOutput()) throw e;
      onEvent({ kind: 'retry' });
      await new Promise(r => setTimeout(r, waits[attempt]));
    }
  }
}

/* ---------- one question, with Claude fetching photos as it needs them ---------- */
async function askClaude(question, ui) {
  const model = aiModel();
  const history = [];
  for (const m of chat.messages.slice(-20)) {
    if (m.error || !m.text) continue;
    const role = m.role === 'user' ? 'user' : 'assistant';
    if (history.length && history[history.length - 1].role === role) history[history.length - 1].content += '\n\n' + m.text;
    else history.push({ role, content: m.text });
  }
  while (history.length && history[0].role !== 'user') history.shift();
  if (history.length && history[history.length - 1].role === 'user') history.pop(); // an unanswered question: drop it
  const seen = []; const budget = { n: AI.maxImages };
  const pd = photoDays(); const auto = [...new Set([pd[0], pd[pd.length - 1]].filter(Boolean))];
  const first = await photoBlocks(auto, null, budget, seen);
  const userContent = [];
  if (first.out.length) userContent.push({ type: 'text', text: `Attached automatically: photos from ${auto.join(' and ')} (${auto.length > 1 ? 'first and latest photo days' : 'the only photo day'}).` }, ...first.out);
  userContent.push({ type: 'text', text: question, cache_control: { type: 'ephemeral' } });
  const messages = [...history, { role: 'user', content: userContent }];
  const system = [{ type: 'text', text: SYSTEM_PROMPT }, { type: 'text', text: 'THE USER\'S SKIN DIARY\n\n' + buildContext(), cache_control: { type: 'ephemeral' } }];
  const usage = { input: 0, output: 0, cacheW: 0, cacheR: 0 };
  let finalText = '', anyText = false;
  let photoRounds = 0;
  for (let round = 0; ; round++) {
    if (round >= AI.maxRounds) throw new AIError('Claude couldn\'t finish that answer. Try a narrower question.');
    const body = { model, max_tokens: 12000, system, tools: [PHOTO_TOOL], messages, thinking: { type: 'adaptive' }, output_config: { effort: 'high' } };
    const res = await streamWithRetry(body, ev => ui.onEvent(ev, round), ui.signal, () => anyText);
    for (const k in usage) usage[k] += res.usage[k] || 0;
    const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('\n\n').trim();
    const calls = res.content.filter(b => b.type === 'tool_use');
    if (res.stop === 'tool_use' && calls.length) {
      // thinking and tool blocks go back exactly as received; only empty text blocks are dropped (the API rejects them)
      messages.push({ role: 'assistant', content: res.content.filter(b => b.type !== 'text' || (b.text && b.text.trim())) });
      const allowed = photoRounds++ < AI.photoRounds;
      const results = [];
      for (const c of calls) {
        const dates = Array.isArray(c.input && c.input.dates) ? c.input.dates.slice(0, 6).map(String) : [];
        if (!allowed || budget.n <= 0) { results.push({ type: 'tool_result', tool_use_id: c.id, content: [{ type: 'text', text: 'You have already looked at enough photos for this question. Write your answer now using what you have seen.' }] }); continue; }
        ui.onEvent({ kind: 'looking', dates }, round);
        const r = c.name === 'get_photos' ? await photoBlocks(dates, c.input.angles, budget, seen) : { out: [], got: [], missing: dates };
        const note = [];
        if (!r.got.length) note.push('No photos found for those dates.');
        if (r.missing.length) note.push(`No photos on: ${r.missing.join(', ')}. Days with photos: ${pd.join(', ')}.`);
        if (budget.n <= 0) note.push('Photo limit for this question reached. Answer with what you have.');
        const content = [...r.out]; if (note.length || !content.length) content.push({ type: 'text', text: note.join(' ') || 'Done.' });
        results.push({ type: 'tool_result', tool_use_id: c.id, content });
      }
      messages.push({ role: 'user', content: results });
      continue;
    }
    finalText = text;
    if (!finalText && res.stop === 'max_tokens') throw new AIError('That needed more room than allowed. Try a narrower question.');
    if (!finalText && res.stop === 'refusal') throw new AIError('Claude couldn\'t answer that one. Try asking it differently.');
    if (!finalText) throw new AIError('No answer came back. Try again.', false);
    break;
  }
  const m = AI.models[model];
  const cost = (usage.input * m.inP + usage.cacheW * m.inP * 1.25 + usage.cacheR * m.inP * .1 + usage.output * m.outP) / 1e6;
  return { text: finalText, photos: seen, model, cost };
}

/* ---------- small, safe markdown ---------- */
function mdInline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'); let html = '', list = null, para = [];
  const flushP = () => { if (para.length) { html += `<p>${para.map(mdInline).join('<br>')}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join('')}</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { flushP(); flushL(); continue; }
    if ((m = l.match(/^\s{0,3}#{1,6}\s+(.*)$/))) { flushP(); flushL(); html += `<h4>${mdInline(m[1])}</h4>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if (list && /^\s{2,}\S/.test(raw)) { list.items[list.items.length - 1] += ' ' + l.trim(); continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL(); return html;
}

    case 'ask-send': if (AI.busy) { if (AI.ctrl) AI.ctrl.abort(); } else sendQuestion($('#askInput').value); break;
    case 'ask-suggest': sendQuestion(ds.q); break;
    case 'ask-retry': { if (AI.busy) break; const last = chat.messages[chat.messages.length - 1]; const q = chat.messages[chat.messages.length - 2]; if (!last || !last.error || !q || q.role !== 'user') break; chat.messages.splice(-2, 2); await saveChat(); sendQuestion(q.text); break; }
    case 'new-chat': if (AI.busy) break; chat.id = null; chat.messages = []; await setMeta('chatId', null); haptic(); renderAsk(); updateNav(); break;
    case 'ai-setup': pendingBackup = null; await renderSettings(); openSheet($('#settingsSheet')); setTimeout(() => { const i = $('#aiKeyInput'); if (i) { i.scrollIntoView({ block: 'center' }); } }, 480); break;
    case 'ai-save-key': {
      const v = ($('#aiKeyInput').value || '').trim();
      if (!v) { S.aiTest = { ok: false, msg: 'Paste your API key first.' }; renderSettings(); break; }
      if (!/^sk-ant-/.test(v)) { S.aiTest = { ok: false, msg: 'That doesn\'t look like a Claude API key. They start with sk-ant-.' }; renderSettings(); break; }
      await setMeta('aiKey', v); haptic(); await testKey(); renderAsk(); break;
    }
    case 'ai-test': testKey(); break;
    case 'ai-model': await setMeta('aiModel', ds.m); S.aiTest = null; haptic(); renderSettings(); break;
    case 'ai-remove-key': if (await actionSheet({ title: 'Remove your API key from this iPhone?', body: 'Ask will stop working until you add a key again. Your chats stay.', ok: 'Remove Key' })) { await setMeta('aiKey', ''); S.aiTest = null; renderSettings(); renderAsk(); } break;
    case 'backdrop': { const top = [...PAGE_SHEETS].reverse().map(s => $(s)).find(s => s.classList.contains('open')); if (top) run(top.dataset.close); break; }
  }
}
document.addEventListener('click', e => {
  const ph = e.target.closest('[data-photo-day]'); if (ph) S.photoTarget = { day: ph.dataset.photoDay, angle: ph.dataset.angle || null };
  const a = e.target.closest('[data-act]'); if (!a) return;
  run(a.dataset.act, a);
});
for (const id of ['#cameraInput', '#libraryInput']) $(id).addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  const t = S.photoTarget || { day: S.openDay || todayKey(), angle: null };
  if (!$('#viewer').hidden) closeViewer();
  await addPhotos(t.day, files, t.angle);
});
$('#restoreInput').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await restoreBackup(f); });
$('#addProductForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#newProduct'); addProduct(i.value); i.value = ''; i.blur(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || $('.as-wrap')) return;
  if (!$('#timer').hidden) closeTimer();
  else if (!$('#viewer').hidden) closeViewer();
  else run('backdrop');
});
(() => { // swipe months
  let sx = 0, sy = 0; const g = $('#grid');
  g.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  g.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dy) < 50) shiftMonth(dx < 0 ? 1 : -1); }, { passive: true });
})();
let lastDay = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (todayKey() !== lastDay) { lastDay = todayKey(); const n = new Date(); S.month = { y: n.getFullYear(), m: n.getMonth() }; }
    renderAll(); if (S.openDay && $('#daySheet').classList.contains('open')) renderDayUses();
  } else flushNotes();
});

/* ================= boot ================= */
async function loadAll() {
  S.thumbs.forEach(l => l.forEach(p => URL.revokeObjectURL(p.url)));
  S.thumbs = new Map(); S.days = new Map(); S.meta = {};
  S.products = await store.all('products');
  for (const d of await store.all('days')) S.days.set(d.date, normDay(d));
  for (const p of S.products) if (!p.routine) { p.routine = guessRoutine(p.name); try { await saveProduct(p); } catch (e) {} }
  for (const t of await store.all('thumbs')) { const l = S.thumbs.get(t.date) || []; l.push({ id: t.id, date: t.date, angle: t.angle, createdAt: t.createdAt, url: URL.createObjectURL(t.blob) }); S.thumbs.set(t.date, l); }
  S.thumbs.forEach(l => {
    l.sort((a, b) => a.createdAt - b.createdAt);
    // photos saved before slots existed: give them the first free angle
    const taken = new Set(l.map(p => p.angle).filter(a => ANGLE_KEYS.includes(a)));
    l.forEach(p => { if (!ANGLE_KEYS.includes(p.angle)) { p.angle = ANGLE_KEYS.find(a => !taken.has(a)) || 'extra'; taken.add(p.angle); } });
  });
  for (const m of await store.all('meta')) S.meta[m.key] = m.value;
}
(async () => {
  const n = new Date(); S.month = { y: n.getFullYear(), m: n.getMonth() };
  await store.open();
  try { await loadAll(); } catch (e) { toast('Saved entries couldn\'t be loaded. Reopen the app.', false); }
  try { await loadChat(); } catch (e) {}
  renderAll(); renderAsk();
  if (STANDALONE) askPersist();
})();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
